name: 'Sync Labels'

on:
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    # Private Repos: Self-hosted Mac-Runner (ubuntu/macos), windows bleibt gehostet; oeffentlich/Fork: wie bisher.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","mac-studio"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
          token: ${{ secrets.GITHUB_TOKEN }}
