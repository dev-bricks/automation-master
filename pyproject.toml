[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-master"
version = "0.1.6"
description = "Local-first automation registry, reward policy, and event-sourced credit governance."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
authors = [{ name = "Lukas Geiger", email = "lukas@open-bricks.org" }]
keywords = [
  "ai-agents",
  "audit-trail",
  "automation",
  "cli",
  "credit-budget",
  "dev-bricks",
  "event-sourcing",
  "fail-closed",
  "governance",
  "local-first",
  "multi-agent",
  "offline-first",
  "open-bricks",
  "python",
  "rate-limiting",
  "reward-policy",
  "runasinvoker",
  "sqlite",
  "task-governance",
  "zero-egress",
]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/automation-master"
Documentation = "https://github.com/dev-bricks/automation-master#readme"
Repository = "https://github.com/dev-bricks/automation-master.git"
Issues = "https://github.com/dev-bricks/automation-master/issues"
Changelog = "https://github.com/dev-bricks/automation-master/blob/main/CHANGELOG.md"
Security = "https://github.com/dev-bricks/automation-master/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/dev-bricks"
Umbrella = "https://github.com/open-bricks"
Contributing = "https://github.com/dev-bricks/automation-master/blob/main/CONTRIBUTING.md"
Notice = "https://github.com/dev-bricks/automation-master/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/dev-bricks/automation-master/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/dev-bricks/automation-master/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/dev-bricks/automation-master/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text Licenses" = "https://github.com/dev-bricks/automation-master/blob/main/THIRD_PARTY_LICENSES.txt"
"Marketing-Log" = "https://github.com/dev-bricks/automation-master/blob/main/MARKETING-LOG.txt"
"LLM-Ready" = "https://github.com/dev-bricks/automation-master/blob/main/llms.txt"


[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
automation-master = "automation_master.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
automation_master = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -v --basetemp=.pytest_temp"
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", ".pytest_tmp*", "__pycache__", "build", "dist", ".venv", ".hypothesis", ".turbo", ".nyc_output", ".tox"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

