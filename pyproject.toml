[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-master"
version = "0.1.3"
description = "Local-first automation registry, reward policy, and event-sourced credit governance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Lukas Geiger", email = "lukas@open-bricks.org" }]
keywords = [
  "automation",
  "governance",
  "event-sourcing",
  "sqlite",
  "local-first",
  "reward-policy",
  "credit-budget",
]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/dev-bricks/automation-master"
Documentation = "https://github.com/dev-bricks/automation-master#readme"
Repository = "https://github.com/dev-bricks/automation-master.git"
Issues = "https://github.com/dev-bricks/automation-master/issues"
Changelog = "https://github.com/dev-bricks/automation-master/blob/main/CHANGELOG.md"
Security = "https://github.com/dev-bricks/automation-master/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/dev-bricks"
Umbrella = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/dev-bricks/automation-master/blob/main/THIRD_PARTY_LICENSES.md"
"Marketing-Log" = "https://github.com/dev-bricks/automation-master/blob/main/MARKETING-LOG.txt"
"LLM-Ready" = "https://github.com/dev-bricks/automation-master/blob/main/llms.txt"


[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
automation-master = "automation_master.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -v"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

